[pytest]
# `pytest cad/tests -q` is the whole suite, the build's final check (3-5 minutes).
# `pytest cad/tests -q -m "not slow"` leaves out what measures meshes point by point - test_wall.py,
# test_fit.py and the pose sweep's gap list - and runs in under 2 minutes.
markers =
    slow: measures meshes point by point; left out of the quick suite
filterwarnings =
    ignore::RuntimeWarning:trimesh
