[pytest]
# `pytest cad/tests -q` is the whole suite, the build's final check (about 4 minutes).
# `pytest cad/tests -q -m "not slow"` leaves out the two files that measure the statue's own meshes
# point by point - test_wall.py and test_fit.py - and runs in under 2 minutes.
markers =
    slow: measures the statue's meshes point by point; left out of the quick suite
filterwarnings =
    ignore::RuntimeWarning:trimesh
