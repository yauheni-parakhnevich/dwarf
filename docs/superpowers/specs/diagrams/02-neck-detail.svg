<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" width="620" height="350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#666"/>
    </marker>
  </defs>
  <style>
    .lbl { font-size: 10.5px; fill: #222; }
    .dim { font-size: 9px; fill: #666; }
    .ln  { stroke: #666; stroke-width: 0.9; fill: none; }
    .part{ stroke: #333; stroke-width: 1.4; fill: #fff; }
    .fill{ fill: #ececec; stroke: #333; stroke-width: 1.3; }
    .water{ stroke: #2b6cb0; stroke-width: 2.4; fill: none; }
    .wire { stroke: #b8860b; stroke-width: 1.8; fill: none; stroke-dasharray: 5 3; }
    .cl   { stroke: #aaa; stroke-width: 0.9; stroke-dasharray: 9 3 2 3; }
  </style>

  <text class="lbl" x="310" y="16" text-anchor="middle" font-size="12">Neck assembly — the hollow shaft carries water and wiring through the rotating joint</text>

  <path class="cl" d="M310 44 v268"/>

  <!-- pan arc -->
  <path class="ln" d="M232 66 a92 92 0 0 1 156 0" marker-end="url(#a2)"/>
  <text class="dim" x="310" y="58" text-anchor="middle">±60° pan</text>

  <!-- head plate -->
  <rect x="226" y="76" width="168" height="14" class="fill"/>
  <!-- bearing -->
  <rect x="246" y="90" width="128" height="20" class="part"/>
  <circle cx="266" cy="100" r="6" fill="#333"/>
  <circle cx="296" cy="100" r="6" fill="#333"/>
  <circle cx="326" cy="100" r="6" fill="#333"/>
  <circle cx="354" cy="100" r="6" fill="#333"/>
  <!-- torso deck -->
  <rect x="212" y="110" width="196" height="14" class="fill"/>
  <!-- hard stop -->
  <rect x="380" y="124" width="16" height="16" class="part"/>
  <!-- hollow shaft -->
  <rect x="294" y="124" width="32" height="86" class="part"/>
  <path class="water" d="M310 124 v86"/>
  <path class="wire" d="M302 124 v86 M318 124 v86"/>
  <!-- servo -->
  <rect x="266" y="210" width="88" height="52" rx="4" class="part"/>
  <text class="lbl" x="310" y="238" text-anchor="middle">DS3218</text>
  <!-- helix -->
  <path class="water" d="M310 262 q-48 10 -42 28 q6 18 48 12 q42 -6 46 12 q4 16 -46 20"/>
  <!-- feed -->
  <path class="water" d="M316 334 h-104"/>

  <!-- LEFT GUTTER, ends x=196 -->
  <text class="lbl" x="196" y="84" text-anchor="end">head plate</text>
  <text class="dim" x="196" y="96" text-anchor="end">yoke bolts here</text>
  <path class="ln" d="M200 86 L222 86" marker-end="url(#a2)"/>

  <text class="lbl" x="196" y="122" text-anchor="end">torso deck</text>
  <path class="ln" d="M200 120 L208 118" marker-end="url(#a2)"/>

  <text class="lbl" x="196" y="158" text-anchor="end">hollow shaft</text>
  <text class="dim" x="196" y="170" text-anchor="end">PU tube inside,</text>
  <text class="dim" x="196" y="181" text-anchor="end">tilt wires alongside</text>
  <path class="ln" d="M200 162 L290 162" marker-end="url(#a2)"/>

  <text class="lbl" x="196" y="332" text-anchor="end">from the valve, in the base</text>
  <path class="ln" d="M200 330 L208 332" marker-end="url(#a2)"/>

  <!-- RIGHT GUTTER, starts x=412 -->
  <text class="lbl" x="412" y="98">thrust bearing, 60–80 mm</text>
  <text class="dim" x="412" y="110">takes the head's 250–350 g</text>
  <path class="ln" d="M408 100 L378 100" marker-end="url(#a2)"/>

  <text class="lbl" x="412" y="134">printed hard stop</text>
  <text class="dim" x="412" y="146">just outside the ±60° limit</text>
  <path class="ln" d="M408 136 L398 134" marker-end="url(#a2)"/>

  <text class="lbl" x="412" y="232">pan servo</text>
  <text class="dim" x="412" y="244">torque only — no axial load</text>
  <path class="ln" d="M408 234 L358 234" marker-end="url(#a2)"/>

  <text class="lbl" x="412" y="292">slack helix around the shaft</text>
  <text class="dim" x="412" y="304">absorbs ±60° of twist</text>
  <text class="dim" x="412" y="315">bend radius &gt; 25 mm</text>
  <path class="ln" d="M408 296 L362 300" marker-end="url(#a2)"/>
</svg>
