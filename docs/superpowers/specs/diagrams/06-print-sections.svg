<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a6" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#666"/>
    </marker>
  </defs>
  <style>
    .lbl { font-size: 10.5px; fill: #222; }
    .dim { font-size: 9px; fill: #666; }
    .ln  { stroke: #666; stroke-width: 0.9; fill: none; }
    .part{ stroke: #333; stroke-width: 1.4; fill: #fff; }
    .fill{ fill: #ececec; stroke: #333; stroke-width: 1.3; }
    .cut { stroke: #c0392b; stroke-width: 2; stroke-dasharray: 8 5; fill: none; }
    .bed { stroke: #2b6cb0; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
  </style>

  <text class="lbl" x="310" y="18" text-anchor="middle" font-size="12">Print sections, and the seam that keeps water out</text>

  <!-- ============ SILHOUETTE: x 206..306 ============ -->
  <g transform="translate(196,40)">
    <path class="fill" d="M96 24 q34 0 40 34 l8 22 h-96 l8 -22 q6 -34 40 -34 z"/>
    <path class="fill" d="M58 80 q-14 46 -10 78 h96 q4 -32 -10 -78 z"/>
    <path class="fill" d="M42 158 q-8 44 0 68 h108 q8 -24 0 -68 z"/>
    <path class="cut" d="M46 80 h100"/>
    <path class="cut" d="M44 118 h102"/>
    <path class="cut" d="M40 158 h112"/>
    <rect class="bed" x="30" y="150" width="132" height="76"/>
  </g>

  <!-- LEFT GUTTER, text ends x=170 -->
  <text class="lbl" x="170" y="118" text-anchor="end" fill="#c0392b">hat / head</text>
  <path class="ln" d="M174 115 L238 118" marker-end="url(#a6)"/>

  <text class="lbl" x="170" y="156" text-anchor="end" fill="#c0392b">bed-height cut</text>
  <path class="ln" d="M174 153 L236 157" marker-end="url(#a6)"/>

  <text class="lbl" x="170" y="192" text-anchor="end" fill="#c0392b">belt split</text>
  <text class="dim" x="170" y="204" text-anchor="end">4 screws, the only</text>
  <text class="dim" x="170" y="215" text-anchor="end">functional joint</text>
  <path class="ln" d="M174 192 L234 197" marker-end="url(#a6)"/>

  <text class="dim" x="170" y="252" text-anchor="end" fill="#2b6cb0">256 mm bed envelope</text>
  <text class="dim" x="170" y="263" text-anchor="end">forces every cut but the belt</text>
  <path class="ln" d="M174 250 L220 240" marker-end="url(#a6)" stroke="#2b6cb0"/>

  <!-- ============ SEAM DETAIL: x 360.. ============ -->
  <g transform="translate(404,44)">
    <text class="lbl" x="0" y="0">Shingled seam — correct</text>
    <path class="part" d="M0 14 h160 v26 h-136 v-12 h-24 z"/>
    <path class="part" d="M24 40 h136 v26 H0 v-14 h24 z"/>
    <path class="ln" d="M-18 4 l16 12" marker-end="url(#a6)"/>
    <text class="dim" x="-22" y="4" text-anchor="end">rain</text>
    <text class="dim" x="0" y="84">the upper section overlaps outside the lower,</text>
    <text class="dim" x="0" y="96">so water runs past the joint</text>

    <text class="lbl" x="0" y="134" fill="#c0392b">Flat butt seam — wrong</text>
    <path class="part" d="M0 148 h160 v24 H0 z"/>
    <path class="part" d="M0 172 h160 v24 H0 z"/>
    <path class="ln" d="M-18 138 l16 12" marker-end="url(#a6)"/>
    <text class="dim" x="-22" y="138" text-anchor="end">rain</text>
    <circle cx="80" cy="172" r="5" fill="#2b6cb0" opacity=".55"/>
    <text class="dim" x="0" y="214">water sits in the joint and freeze-thaws</text>
    <text class="dim" x="0" y="226">it open over the winter</text>

    <text class="dim" x="0" y="262">Dowels + epoxy for permanent seams.</text>
    <text class="dim" x="0" y="274">Acetone welds ASA, not PETG.</text>
    <text class="dim" x="0" y="286">Heat-set inserts wherever it reopens.</text>
  </g>
</svg>
