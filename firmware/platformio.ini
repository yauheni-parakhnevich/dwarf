[env]
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_flags = -std=gnu++17
; The Arduino ESP32 build script appends its own -std=gnu++11 after the project's
; flags, and GCC honours the last -std it is given, so without this the whole
; esp32dev build silently compiles as C++11. Limits has default member initializers,
; which only became aggregate-initialisable in C++14, so lib/dwarf stops compiling the
; moment it is built for the board rather than for the native tests.
build_unflags = -std=gnu++11

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.2
    madhephaestus/ESP32Servo@^3.0.5
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.8
build_flags =
    ${env.build_flags}
    ; Exactly one phone is meant to control the gnome (the spec has a single
    ; BLE central throughout). NimBLE-Arduino's own default is 3 bond slots,
    ; which only gives an attacker two spare slots to squat with junk bonds
    ; while doing nothing useful for this project -- there is no legitimate
    ; second controller. Capping it at 1 means the bond store fills after the
    ; very first pairing, on purpose: from then on NimBLEDevice::deleteAllBonds()
    ; (the serial escape hatch in main.cpp) is the only way to pair a
    ; different central, which is exactly the "requires physical access"
    ; property the task asked for, applied to re-pairing as well as to
    ; recovery. See main.cpp's BLE access-control comment block for the rest
    ; of the design and its adversarial analysis.
    -D CONFIG_BT_NIMBLE_MAX_BONDS=1

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    ${env.build_flags}
    -DDWARF_NATIVE
    -Wall
    -Wextra
